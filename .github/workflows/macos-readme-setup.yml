name: macOS README setup

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  local-setup:
    name: Validate local setup on macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/etl/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r app/backend/requirements.txt

      - name: Install ETL package
        run: python -m pip install -e app/etl

      - name: Verify ETL CLI is installed
        run: fire-vulnerability-etl --help

      - name: Run backend tests
        run: python -m pytest app/backend/tests

      - name: Run ETL tests
        working-directory: app/etl
        run: python -m pytest

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Start backend and check health endpoint
        shell: bash
        run: |
          python app/backend/app.py > backend.log 2>&1 &
          backend_pid=$!

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/test > /tmp/backend-health.json; then
              cat /tmp/backend-health.json
              kill "$backend_pid"
              exit 0
            fi
            sleep 1
          done

          cat backend.log
          kill "$backend_pid"
          exit 1
