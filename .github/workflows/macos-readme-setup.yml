name: macOS README setup

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  local-setup:
    name: Validate local setup on macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/etl/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      # =========================
      # Backend dependencies
      # =========================
      - name: Install backend dependencies
        run: python -m pip install -r app/backend/requirements.txt

      # =========================
      # ETL install
      # =========================
      - name: Install ETL package
        run: python -m pip install -e app/etl

      # =========================
      # Frontend install (early OK for caching)
      # =========================
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      # =========================
      # Raw data download
      # =========================
      - name: Install gdown
        run: python -m pip install gdown

      - name: Download raw data from Google Drive
        run: |
          mkdir -p app/data/raw
          gdown --folder "https://drive.google.com/drive/folders/1DvnN04IMejH7PDkVcPO-_DFWbq35BOTg" -O app/data/raw

      # =========================
      # ETL pipeline
      # =========================
      - name: Run ETL pipeline
        run: |
          fire-vulnerability-etl \
            --raw-data-dir app/data/raw \
            --output-dir app/data/derived

      # =========================
      # Risk analysis pipeline
      # =========================
      - name: Run risk analysis scripts
        shell: bash
        run: |
          cd app/backend/scripts/risk
          bash run_all.sh

      # =========================
      # Verify ETL CLI
      # =========================
      - name: Verify ETL CLI is installed
        run: fire-vulnerability-etl --help

      # =========================
      # Backend runtime check
      # =========================
      - name: Start backend and check health endpoint
        shell: bash
        run: |
          python app/backend/app.py > backend.log 2>&1 &
          backend_pid=$!

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/test > /tmp/backend-health.json; then
              cat /tmp/backend-health.json
              kill "$backend_pid"
              exit 0
            fi
            sleep 1
          done

          echo "Backend failed to start"
          cat backend.log
          kill "$backend_pid"
          exit 1

      # =========================
      # Frontend build check
      # =========================
      - name: Build frontend
        working-directory: app/frontend
        run: npm run build


  useful-checks:
    name: Run README useful checks on macOS
    runs-on: macos-latest
    needs: local-setup
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/etl/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -r app/backend/requirements.txt

      - name: Install ETL package
        run: python -m pip install -e app/etl

      # =========================
      # Tests
      # =========================
      - name: Run backend tests
        run: python -m pytest app/backend/tests

      - name: Run ETL tests
        working-directory: app/etl
        run: python -m pytest